# API under HTTPS — reverse proxy snippet for Apache
# Place BEFORE the rule that proxies the Nuxt admin app.
#
# Browser:  https://pos.chinthurakij.com/api/auth/login
# Upstream: http://127.0.0.1:8123/auth/login

ProxyPreserveHost On
ProxyPass        /api/ http://127.0.0.1:8123/
ProxyPassReverse /api/ http://127.0.0.1:8123/
